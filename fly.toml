# Fly.io deployment config. Edit `app` to your chosen name before deploying.
app = "itsallgreektome"
primary_region = "iad"

[build]

[env]
  DATA_DIR = "/data"
  PORT = "8080"

[mounts]
  source = "greek_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
